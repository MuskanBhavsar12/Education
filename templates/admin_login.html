<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Login — Smart Institute</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg,#0d1b2a,#1b2a48); }
    .card { border-radius: 1rem; }
    .btn-login { background: #ffc107; border: none; color: #000; font-weight: bold; }
    .btn-login:hover { background: #e0a800; color: #000; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-lg p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-circle fs-1 text-warning"></i>
            <h4 class="mt-2">Admin Login</h4>
            <p class="text-secondary">Enter credentials to access dashboard</p>
          </div>

          {% with msgs = get_flashed_messages(with_categories=true) %}
            {% if msgs %}
              {% for cat, m in msgs %}
                <div class="alert alert-{{cat}} py-2">{{ m }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="POST" action="/admin-login">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-login w-100 py-2 mb-3">Login</button>
          </form>

          <div class="text-center">
            <a href="/" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="../static/app.js" defer></script>
</body>
</html>
